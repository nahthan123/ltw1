<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Quản lý sinh viên</title>

<style>
    body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(135deg, #43cea2, #185a9d);
        min-height: 100vh;
        padding: 40px;
    }

    .container {
        max-width: 950px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 15px 30px rgba(0,0,0,.25);
    }

    h2 {
        text-align: center;
        margin-bottom: 25px;
    }

    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
    }

    .top-bar form {
        display: flex;
        gap: 8px;
    }

    input[type="text"] {
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
        width: 220px;
    }

    button {
        padding: 8px 14px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background: #0d6efd;
        color: white;
    }

    button:hover {
        opacity: 0.9;
    }

    .add-btn {
        text-decoration: none;
        background: #28a745;
        color: white;
        padding: 8px 14px;
        border-radius: 6px;
        font-weight: 600;
    }

    .add-btn:hover {
        opacity: 0.9;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
    }

    th {
        background: #0d6efd;
        color: white;
        padding: 10px;
    }

    td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
        text-align: center;
    }

    tr:hover {
        background: #f2f6ff;
    }

    .edit {
        text-decoration: none;
        color: #0d6efd;
        font-weight: 600;
    }

    .delete {
        text-decoration: none;
        color: #dc3545;
        font-weight: 600;
    }

    .edit:hover, .delete:hover {
        text-decoration: underline;
    }
</style>
</head>

<body>

<div class="container">
    <h2>📚 QUẢN LÝ SINH VIÊN</h2>

    <div class="top-bar">
        <!-- TÌM KIẾM – KHÔNG ĐỔI -->
        <form method="get" action="/students">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm theo tên">
            <button type="submit">🔍 Tìm</button>
        </form>

        <!-- THÊM – KHÔNG ĐỔI -->
        <a href="/students/add" class="add-btn">➕ Thêm sinh viên</a>
    </div>

    <table>
        <tr>
            <th>ID</th>
            <th>Tên</th>
            <th>Tuổi</th>
            <th>Email</th>
            <th>Hành động</th>
        </tr>

        <tr th:each="sv : ${students}">
            <td th:text="${sv.id}"></td>
            <td th:text="${sv.name}"></td>
            <td th:text="${sv.age}"></td>
            <td th:text="${sv.email}"></td>
            <td>
                <a th:href="@{/students/edit/{id}(id=${sv.id})}" class="edit">✏️ Sửa</a>
                |
                <a th:href="@{/students/delete/{id}(id=${sv.id})}"
                   class="delete"
                   onclick="return confirm('Xóa sinh viên này?')">🗑 Xóa</a>
            </td>
        </tr>
    </table>
</div>

</body>
</html>
